name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Embed frontend into the Go build
        run: |
          rm -rf server/internal/web/dist
          mkdir -p server/internal/web/dist
          cp -r web/build/. server/internal/web/dist/

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Cross-compile binaries
        working-directory: server
        # CGO_ENABLED=0 gives fully static binaries (the SQLite driver is
        # pure Go), so the same build runs on any Linux distro.
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../easyplan-linux-amd64 ./cmd/easyplan
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../easyplan-linux-arm64 ./cmd/easyplan

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            easyplan-linux-amd64
            easyplan-linux-arm64
          generate_release_notes: true
